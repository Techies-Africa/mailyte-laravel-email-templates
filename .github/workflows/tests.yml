name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13.*'
        include:
          # One run against the oldest dependencies each constraint allows, so
          # a version floor that is quietly wrong fails here rather than in
          # someone's application.
          - php: '8.2'
            laravel: '11.*'
            stability: prefer-lowest

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, json
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/mail:${{ matrix.laravel }}" "illuminate/view:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run the test suite
        run: vendor/bin/pest --ci
